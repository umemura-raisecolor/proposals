<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>読み込み中</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* IMPACT:全画面の写真が斜めにシャッと切り替わり、写真に巨大な英字がまたがる型。紺×ゴールド、シャープ。 */
:root{
  --navy:#0a1428; --navy2:#101d36; --ink:#16202f; --paper:#ffffff; --mist:#f2f4f7; --line:#dde2ea;
  --gold:#c9a55c; --gold2:#e6c88a; --muted:#5a6475;
  --en:"Anton","Oswald","Impact",sans-serif;
  --disp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  --ease:cubic-bezier(.77,0,.18,1);
  --gut:max(20px, env(safe-area-inset-left, 0px));
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.9;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:max(20px, env(safe-area-inset-right, 0px))}
.gold{color:var(--gold)}

/* ---------- ヘッダー ---------- */
.hd{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .4s,box-shadow .4s}
.hd.solid{background:rgba(10,20,40,.94);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(201,165,92,.35)}
.hd-in{display:flex;align-items:center;gap:24px;height:76px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;flex-shrink:0}
.brand img{height:40px;width:auto}
.brand b{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:.04em;line-height:1.2}
.brand small{display:block;font-family:var(--en);font-size:11px;letter-spacing:.3em;color:var(--gold)}
.nav{display:flex;gap:26px;margin-left:auto}
.nav a{color:#fff;text-decoration:none;font-weight:500;font-size:15px;position:relative;padding:4px 0}
.nav a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.nav a:hover::after{transform:scaleX(1);transform-origin:left}
.hd-tel{color:#fff;text-decoration:none;text-align:right;line-height:1.2;flex-shrink:0}
.hd-tel b{font-family:var(--en);font-size:26px;letter-spacing:.04em;display:block}
.hd-tel small{font-size:11px;color:var(--gold2)}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;width:48px;height:48px;font-size:12px;font-weight:700;cursor:pointer}

/* ---------- 光るボタン ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;
  padding:18px 34px;font-family:var(--disp);font-weight:700;font-size:17px;text-decoration:none;letter-spacing:.06em;border:0;cursor:pointer;transition:transform .25s,background .25s}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold2);transform:translateY(-2px)}
.btn-line{border:1.5px solid rgba(255,255,255,.7);color:#fff;background:rgba(10,20,40,.25)}
.btn-line:hover{background:#fff;color:var(--navy)}
.shine::after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-25deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,62%{left:-60%}100%{left:140%}}
.btn .arw{display:inline-block;transition:transform .25s}
.btn:hover .arw{transform:translateX(4px)}

/* ---------- ファーストビュー ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:600px;background:var(--navy);overflow:hidden;color:#fff}
.slide{position:absolute;inset:0;clip-path:inset(0 0 0 100%);z-index:1}
.slide.is-on{clip-path:inset(0 0 0 0);z-index:3;transition:clip-path 1.25s var(--ease)}
.slide.is-prev{clip-path:inset(0 0 0 0);z-index:2}
.slide .ph{position:absolute;inset:-4%;background-size:cover;background-position:center;transform:scale(1.18)}
.slide.is-on .ph{animation:kb 9s linear forwards}
.slide:nth-child(even).is-on .ph{animation-name:kb2}
@keyframes kb{from{transform:scale(1.18) translateX(2%)}to{transform:scale(1.03) translateX(-1%)}}
@keyframes kb2{from{transform:scale(1.04) translateX(-2%)}to{transform:scale(1.18) translateX(1%)}}
.slide::after{content:"";position:absolute;inset:0;background:
  linear-gradient(100deg,rgba(10,20,40,.92) 0%,rgba(10,20,40,.66) 38%,rgba(10,20,40,.12) 72%,rgba(10,20,40,.35) 100%),
  linear-gradient(0deg,rgba(10,20,40,.85) 0%,rgba(10,20,40,0) 45%)}
/* 切り替わりの瞬間に走る金の斜め帯 */
.sweep{position:absolute;top:-10%;bottom:-10%;width:18vw;left:105%;z-index:6;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(201,165,92,.0) 10%,rgba(201,165,92,.95) 50%,rgba(230,200,138,.0) 90%,transparent);transform:skewX(-18deg);opacity:0}
.sweep.go{animation:sweep 1.25s var(--ease)}
@keyframes sweep{0%{left:105%;opacity:1}100%{left:-30%;opacity:.9}}

/* 巨大な英字 */
.en{position:absolute;z-index:5;right:-1vw;top:50%;transform:translateY(-58%);font-family:var(--en);text-transform:uppercase;
  font-size:clamp(76px,15.5vw,270px);line-height:.84;letter-spacing:-.005em;text-align:right;pointer-events:none;will-change:transform}
.en .ln{display:block;overflow:hidden;padding:.02em .04em 0}
.en .ln:nth-child(2){color:transparent;-webkit-text-stroke:2px var(--gold)}
.en .ch{display:inline-block;transform:translateY(105%)}
.en.on .ch{transform:none;transition:transform .9s var(--ease)}
.en.off .ch{transform:translateY(-105%);transition:transform .5s var(--ease)}

/* 日本語のキャッチ */
.copy{position:absolute;z-index:7;left:max(6vw,var(--gut));bottom:max(150px,18vh);max-width:min(760px,88vw)}
.kicker{display:flex;align-items:center;gap:14px;font-weight:700;font-size:16px;letter-spacing:.12em;color:var(--gold2);overflow:hidden}
.kicker::before{content:"";width:46px;height:2px;background:var(--gold);flex-shrink:0;transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease) .2s}
.kicker span{display:block;transform:translateX(-30px);opacity:0;transition:all .7s var(--ease) .3s}
.copy.on .kicker::before{transform:none}.copy.on .kicker span{transform:none;opacity:1}
.catch{margin:18px 0 0;font-family:var(--disp);font-weight:900;font-size:clamp(40px,5.4vw,84px);white-space:nowrap;line-height:1.18;letter-spacing:.02em;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.catch .ln{display:block;overflow:hidden;padding-bottom:.06em}
.catch .ln>span{display:block;transform:translateY(110%)}
.copy.on .catch .ln>span{transform:none;transition:transform 1s var(--ease)}
.copy.on .catch .ln:nth-child(2)>span{transition-delay:.12s}
.catch em{font-style:normal;color:var(--gold);position:relative}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;opacity:0;transform:translateY(16px);transition:all .8s var(--ease) .5s}
.hero.ready .cta-row{opacity:1;transform:none}

/* 右下:写真のサムネイルと進み具合 */
.thumbs{position:absolute;z-index:8;right:max(24px,env(safe-area-inset-right,0px));bottom:118px;display:flex;gap:10px}
.thumb{width:132px;background:none;border:0;padding:0;color:#fff;text-align:left;cursor:pointer;opacity:.55;transition:opacity .3s}
.thumb:hover,.thumb.is-on{opacity:1}
.thumb .t-img{height:70px;background-size:cover;background-position:center;outline:1px solid rgba(255,255,255,.25)}
.thumb.is-on .t-img{outline:2px solid var(--gold)}
.thumb .bar{display:block;height:3px;background:rgba(255,255,255,.25);margin-top:8px;position:relative;overflow:hidden}
.thumb .bar i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left}
.thumb.is-on .bar i{animation:prog var(--dur,6.5s) linear forwards}
.thumb small{display:block;font-size:11px;line-height:1.5;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes prog{to{transform:scaleX(1)}}
.hero.paused .thumb.is-on .bar i{animation-play-state:paused}

/* 下を流れる文字 */
.marq{position:absolute;z-index:8;left:0;right:0;bottom:0;height:68px;background:rgba(10,20,40,.82);border-top:1px solid rgba(201,165,92,.4);overflow:hidden;display:flex;align-items:center}
.marq-in{display:flex;gap:46px;white-space:nowrap;animation:marq 38s linear infinite;padding-left:46px}
.marq-in span{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.12em;display:flex;align-items:center;gap:46px}
.marq-in span::after{content:"";width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
@keyframes marq{to{transform:translateX(-50%)}}
.scroll{position:absolute;z-index:8;left:max(24px,env(safe-area-inset-left,0px));bottom:96px;font-family:var(--en);font-size:12px;letter-spacing:.3em;writing-mode:vertical-rl;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.8)}
.scroll::after{content:"";width:1px;height:70px;background:linear-gradient(var(--gold),transparent);animation:drop 2s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* オープニング */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none}
.intro::before,.intro::after{content:"";position:absolute;left:0;right:0;height:50.5%;background:var(--navy);transition:transform 1s var(--ease)}
.intro::before{top:0}.intro::after{bottom:0}
.intro .nm{position:relative;z-index:2;text-align:center;color:#fff;transition:opacity .4s}
.intro .nm b{display:block;font-family:var(--en);font-size:clamp(44px,9vw,110px);letter-spacing:.12em;line-height:1}
.intro .nm b span{display:inline-block;opacity:0;transform:translateY(30px);animation:inl .7s var(--ease) forwards}
.intro .nm i{display:block;height:2px;background:var(--gold);margin:18px auto 0;width:0;animation:inw .8s var(--ease) .5s forwards}
@keyframes inl{to{opacity:1;transform:none}}
@keyframes inw{to{width:100%}}
.intro.open .nm{opacity:0}
.intro.open::before{transform:translateY(-101%)}
.intro.open::after{transform:translateY(101%)}

/* ---------- 数字の帯 ---------- */
.facts{background:var(--navy);color:#fff;border-top:1px solid rgba(201,165,92,.25)}
.facts-in{display:grid;grid-template-columns:repeat(4,1fr)}
.fact{padding:46px 18px;text-align:center;border-left:1px solid rgba(255,255,255,.1)}
.fact:first-child{border-left:0}
.fact .n{font-family:var(--en);font-size:clamp(56px,6vw,84px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-block}
.fact .n.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{50%{transform:scale(1.18)}}
.fact .u{font-family:var(--disp);font-weight:900;font-size:22px;margin-left:4px}
.fact p{margin:12px 0 0;font-size:15px;line-height:1.6;color:rgba(255,255,255,.85)}

/* ---------- セクション共通 ---------- */
.sec{padding-block:120px}
.sec.mist{background:var(--mist)}
.sec.dark{background:var(--navy);color:#fff}
.hgroup{margin-bottom:56px}
.hgroup .e{font-family:var(--en);font-size:clamp(54px,8vw,120px);line-height:.9;color:var(--navy);opacity:.08;display:block;margin-bottom:-.42em;letter-spacing:.02em}
.sec.dark .hgroup .e{color:#fff;opacity:.1}
.hgroup h2{position:relative;margin:0;font-family:var(--disp);font-weight:900;font-size:clamp(30px,3.6vw,46px);line-height:1.35;text-wrap:balance}
.hgroup h2::after{content:"";display:block;width:56px;height:3px;background:var(--gold);margin-top:18px}
.hgroup p{margin:20px 0 0;color:var(--muted);font-size:18px;max-width:40em}
.sec.dark .hgroup p{color:rgba(255,255,255,.75)}

/* ふわっと出る(JSが動くときだけ) */
.js .rv{opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.js .rv.in{opacity:1;transform:none}

/* ---------- 施工事例(見比べ) ---------- */
.works{display:grid;gap:72px}
.work{display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:center}
.work:nth-child(even){grid-template-columns:1fr 1.5fr}
.work:nth-child(even) .cmp{order:2}
.cmp{position:relative;aspect-ratio:3/2;max-width:100%;overflow:hidden;background:#ccd;--p:50%;user-select:none;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .aft{clip-path:inset(0 0 0 var(--p))}
.cmp .lb{position:absolute;top:16px;z-index:3;font-family:var(--en);font-size:15px;letter-spacing:.2em;padding:6px 14px;color:#fff;background:rgba(10,20,40,.8)}
.cmp .lb.b{left:16px}.cmp .lb.a{right:16px;background:var(--gold);color:var(--navy)}
.cmp .hdl{position:absolute;top:0;bottom:0;left:var(--p);width:3px;background:#fff;z-index:4;transform:translateX(-50%);pointer-events:none;box-shadow:0 0 12px rgba(0,0,0,.4)}
.cmp .hdl::after{content:"◀ ▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:12px;letter-spacing:.1em;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:5;margin:0}
.cmp input:focus-visible+.hdl{outline:3px solid var(--gold2)}
.work .area{font-weight:700;color:var(--gold);letter-spacing:.1em;font-size:15px}
.work h3{margin:6px 0 14px;font-family:var(--disp);font-weight:900;font-size:clamp(24px,2.5vw,32px);line-height:1.4}
.work p{margin:0;color:var(--muted)}

/* ---------- 選ばれる理由 ---------- */
.reasons{display:grid;gap:100px}
.reason{display:grid;grid-template-columns:1.25fr 1fr;align-items:center;position:relative}
.reason:nth-child(even){grid-template-columns:1fr 1.25fr}
.reason:nth-child(even) .r-img{order:2}
.r-img{aspect-ratio:4/3;max-width:100%;overflow:hidden}
.r-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.reason:hover .r-img img{transform:scale(1.05)}
.r-txt{background:var(--paper);padding:52px 48px;margin-left:-90px;position:relative;z-index:2;box-shadow:0 30px 60px rgba(10,20,40,.12)}
.reason:nth-child(even) .r-txt{margin-left:0;margin-right:-90px}
.r-txt .k{font-family:var(--en);color:var(--gold);font-size:16px;letter-spacing:.25em}
.r-txt h3{margin:8px 0 18px;font-family:var(--disp);font-weight:900;font-size:clamp(24px,2.6vw,34px);line-height:1.4;text-wrap:balance}
.r-txt p{margin:0;color:var(--muted)}

/* ---------- 代表あいさつ ---------- */
.msg{display:grid;grid-template-columns:420px 1fr;gap:72px;align-items:center}
.msg-ph{position:relative;max-width:100%}
.msg-ph img{width:100%;aspect-ratio:4/5;object-fit:cover}
.msg-ph::before{content:"";position:absolute;inset:24px -24px -24px 24px;border:2px solid var(--gold);z-index:-1}
.msg-ph{z-index:0}
.msg h3{margin:0 0 28px;font-family:var(--disp);font-weight:900;font-size:clamp(28px,3.2vw,42px);line-height:1.45;text-wrap:balance}
.msg h3 em{font-style:normal;color:var(--gold)}
.msg p{margin:0 0 18px;color:rgba(255,255,255,.85)}
.msg .sign{margin-top:30px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.msg .sign small{color:var(--gold2);font-size:14px}
.msg .sign b{font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:.12em}

/* ---------- 工事の内容 ---------- */
.svcs{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.svc{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;color:#fff;background:var(--navy)}
.svc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),opacity .5s}
.svc::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,20,40,.95) 10%,rgba(10,20,40,.2) 70%);transition:background .5s}
.svc:hover img{transform:scale(1.08)}
.svc-in{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:26px 24px}
.svc .e{font-family:var(--en);color:var(--gold);letter-spacing:.18em;font-size:14px}
.svc h3{margin:4px 0 10px;font-family:var(--disp);font-weight:900;font-size:24px;line-height:1.35}
.svc p{margin:0;font-size:15px;line-height:1.7;color:rgba(255,255,255,.85)}

/* ---------- 流れ ---------- */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:f;list-style:none;margin:0;padding:0}
.flow li{position:relative;padding:34px 28px 34px;border-top:3px solid var(--line);counter-increment:f}
.flow li::before{content:"STEP " counter(f);display:block;font-family:var(--en);color:var(--gold);letter-spacing:.2em;font-size:15px}
.flow li::after{content:"";position:absolute;top:-3px;left:0;height:3px;width:0;background:var(--gold);transition:width 1s var(--ease)}
.flow.in li::after{width:100%}
.flow.in li:nth-child(2)::after{transition-delay:.3s}.flow.in li:nth-child(3)::after{transition-delay:.6s}.flow.in li:nth-child(4)::after{transition-delay:.9s}
.flow h3{margin:8px 0 10px;font-family:var(--disp);font-weight:900;font-size:22px}
.flow p{margin:0;color:var(--muted);font-size:16px;line-height:1.8}

/* ---------- 会社概要 ---------- */
.prof{width:100%;border-collapse:collapse;font-size:17px}
.prof th,.prof td{padding:20px 22px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.prof th{width:200px;font-weight:700;color:var(--navy);background:var(--mist)}

/* ---------- お問い合わせ ---------- */
.contact{position:relative;overflow:hidden;background:var(--navy);color:#fff}
.contact .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22}
.contact .wrap{position:relative;padding-block:120px}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.ct-big{font-family:var(--disp);font-weight:900;font-size:clamp(32px,4vw,52px);line-height:1.35;margin:0 0 20px;text-wrap:balance}
.ct-tel{display:inline-block;text-decoration:none;color:#fff;margin-top:20px}
.ct-tel small{display:block;color:var(--gold2);font-size:15px;font-weight:700;letter-spacing:.1em}
.ct-tel b{font-family:var(--en);font-size:clamp(44px,5.4vw,68px);letter-spacing:.03em;line-height:1.1}
.ct-note{color:rgba(255,255,255,.8);margin-top:6px}
.form{background:#fff;color:var(--ink);padding:40px 36px;display:grid;gap:18px}
.form label{display:grid;gap:6px;font-weight:700;font-size:15px}
.form label span{color:#b8892e;font-size:12px;margin-left:6px}
.form input,.form select,.form textarea{font:inherit;font-size:17px;padding:14px 14px;border:1px solid #c8cfda;background:#fff;color:var(--ink);width:100%}
.form textarea{min-height:120px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.form .btn{width:100%}
.form .done{margin:0;font-weight:700;color:var(--navy);text-align:center}

/* ---------- フッター ---------- */
.ft{background:#060d1b;color:rgba(255,255,255,.7);font-size:14px;padding-block:44px 120px}
.ft b{color:#fff;font-family:var(--disp);font-size:18px}
.ft p{margin:6px 0 0}

/* スマホ下の固定ボタン */
.fixbar{display:none}

/* ---------- 画面幅ごとの調整 ---------- */
@media (max-width:1100px){
  .nav{display:none}
  .thumb{width:104px}.thumb .t-img{height:56px}
  .svcs{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  body{font-size:16px}
  .hd-in{height:64px}
  .hd-tel{display:none}
  .menu-btn{display:block}
  .nav.open{display:flex;flex-direction:column;position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:0;right:0;background:var(--navy);padding:20px max(24px,env(safe-area-inset-left,0px)) 28px;gap:4px;margin:0}
  .nav.open a{font-size:18px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
  .hero{min-height:560px}
  .en{top:22%;transform:none;right:-2vw;font-size:clamp(66px,23vw,140px)}
  .copy{bottom:150px;left:var(--gut);right:var(--gut);max-width:none}
  .catch{font-size:clamp(34px,9.6vw,56px);white-space:normal}
  .kicker{font-size:13px}
  .cta-row .btn-line{display:none}
  .cta-row .btn{padding:16px 24px;font-size:16px}
  .thumbs{left:var(--gut);right:auto;bottom:86px;gap:6px}
  .thumb{width:auto}.thumb .t-img,.thumb small{display:none}
  .thumb .bar{width:44px;margin:0}
  .scroll{display:none}
  .marq{height:56px}.marq-in span{font-size:16px}
  .facts-in{grid-template-columns:repeat(2,1fr)}
  .fact{padding:34px 12px;border-top:1px solid rgba(255,255,255,.1)}
  .fact:nth-child(odd){border-left:0}
  .sec{padding-block:80px}
  .hgroup{margin-bottom:40px}
  .work,.work:nth-child(even){grid-template-columns:1fr;gap:22px}
  .work:nth-child(even) .cmp{order:0}
  .reasons{gap:56px}
  .reason,.reason:nth-child(even){grid-template-columns:1fr}
  .reason:nth-child(even) .r-img{order:0}
  .r-txt,.reason:nth-child(even) .r-txt{margin:-50px 16px 0;padding:32px 24px}
  .msg{grid-template-columns:1fr;gap:56px}
  .msg-ph{max-width:340px;margin-right:24px}
  .flow{grid-template-columns:1fr}
  .flow li{padding:26px 4px}
  .prof th,.prof td{display:block;width:auto;padding:12px 14px}
  .prof th{border-bottom:0}
  .ct-grid{grid-template-columns:1fr}
  .form{padding:30px 22px}
  .fixbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:60;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--navy);transform:translateY(100%);transition:transform .4s var(--ease)}
  .fixbar.show{transform:none}
  .fixbar a{display:flex;align-items:center;justify-content:center;gap:8px;height:60px;text-decoration:none;font-weight:700;font-size:16px;color:#fff}
  .fixbar a+a{background:var(--gold);color:var(--navy)}
}
@media (max-width:520px){
  .svcs{grid-template-columns:1fr}
  .svc{aspect-ratio:16/11}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .marq-in{animation:none}
}
</style>
<script src="site.js"></script>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var S = window.SITE || {};
  var root = document.documentElement;
  root.classList.add("js");
  if (S.colors){ if (S.colors.navy) root.style.setProperty("--navy", S.colors.navy); if (S.colors.gold) root.style.setProperty("--gold", S.colors.gold); }
  document.title = S.title || S.company || "";
  var md = document.querySelector('meta[name="description"]'); if (md) md.content = S.description || "";

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function hl(s){ return esc(s).replace(/\{(.+?)\}/g, "<em>$1</em>"); }
  function chars(s){ return Array.from(String(s)).map(function(c, i){ return '<span class="ch" style="transition-delay:' + (i * 0.035).toFixed(3) + 's">' + (c === " " ? "&nbsp;" : esc(c)) + "</span>"; }).join(""); }
  function telHref(t){ return "tel:" + String(t || "").replace(/[^0-9+]/g, ""); }

  var slides = S.slides || [];
  var nav = [["施工事例","#works"],["選ばれる理由","#reasons"],["ごあいさつ","#message"],["工事の内容","#service"],["会社概要","#company"],["お問い合わせ","#contact"]];

  var h = "";
  // ヘッダー
  h += '<header class="hd" id="hd"><div class="hd-in">'
    + '<a class="brand" href="#top">' + (S.logo ? '<img src="' + esc(S.logo) + '" alt="' + esc(S.company) + '">' : "")
    + '<span><b>' + esc(S.company) + '</b><small>' + esc(S.companyEn) + '</small></span></a>'
    + '<nav class="nav" id="nav">' + nav.map(function(n){ return '<a href="' + n[1] + '">' + n[0] + "</a>"; }).join("") + "</nav>"
    + '<a class="hd-tel" href="' + telHref(S.tel) + '"><b>' + esc(S.tel) + '</b><small>' + esc(S.telNote) + "</small></a>"
    + '<button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">MENU</button>'
    + "</div></header>";

  // ファーストビュー
  h += '<section class="hero" id="top" aria-label="' + esc(S.company) + '">';
  slides.forEach(function(s, i){
    h += '<div class="slide" data-i="' + i + '"><div class="ph" style="background-image:url(\'' + esc(s.img) + '\');background-position:' + esc(s.pos || "50% 50%") + '"></div></div>';
  });
  h += '<div class="sweep" id="sweep"></div>';
  h += '<div class="en" id="en" aria-hidden="true"></div>';
  h += '<div class="copy" id="copy"><div class="kicker"><span id="kicker"></span></div><h1 class="catch" id="catch"></h1>'
    + '<div class="cta-row"><a class="btn btn-gold shine" href="#contact">無料でお見積りを相談する <span class="arw">→</span></a>'
    + '<a class="btn btn-line" href="#works">施工事例を見る</a></div></div>';
  h += '<div class="thumbs" id="thumbs">' + slides.map(function(s, i){
    return '<button class="thumb" data-i="' + i + '" aria-label="' + esc(s.caption) + '"><span class="t-img" style="background-image:url(\'' + esc(s.img) + '\')"></span><span class="bar"><i></i></span><small>' + esc(s.caption) + "</small></button>";
  }).join("") + "</div>";
  var mq = (S.marquee || []).map(function(m){ return "<span>" + esc(m) + "</span>"; }).join("");
  h += '<div class="scroll">SCROLL</div>';
  h += '<div class="marq" aria-hidden="true"><div class="marq-in">' + mq + mq + mq + mq + "</div></div>";
  h += "</section>";

  // 数字
  if (S.facts && S.facts.length){
    h += '<section class="facts"><div class="wrap facts-in">' + S.facts.map(function(f){
      return '<div class="fact"><span class="n" data-to="' + esc(f.num) + '">' + esc(f.num) + '</span><span class="u">' + esc(f.unit) + "</span><p>" + esc(f.label) + "</p></div>";
    }).join("") + "</div></section>";
  }

  // 施工事例
  if (S.works && S.works.items){
    h += '<section class="sec" id="works"><div class="wrap"><div class="hgroup rv"><span class="e">WORKS</span><h2>施工事例</h2><p>' + esc(S.works.lead) + "</p></div><div class=\"works\">";
    S.works.items.forEach(function(w, i){
      h += '<article class="work rv"><div class="cmp">'
        + '<img src="' + esc(w.before) + '" alt="' + esc(w.title) + ' 施工前" loading="lazy">'
        + '<img class="aft" src="' + esc(w.after) + '" alt="' + esc(w.title) + ' 施工後" loading="lazy">'
        + '<span class="lb b">BEFORE</span><span class="lb a">AFTER</span>'
        + '<input type="range" min="0" max="100" value="50" id="cmp' + i + '" aria-label="施工前と施工後を見比べる">'
        + '<span class="hdl"></span></div>'
        + '<div><div class="area">' + esc(w.area) + '</div><h3>' + esc(w.title) + "</h3><p>" + esc(w.text) + "</p></div></article>";
    });
    h += "</div></div></section>";
  }

  // 選ばれる理由
  if (S.reasons && S.reasons.items){
    h += '<section class="sec mist" id="reasons"><div class="wrap"><div class="hgroup rv"><span class="e">REASON</span><h2>選ばれる理由</h2><p>' + esc(S.reasons.lead) + '</p></div><div class="reasons">';
    S.reasons.items.forEach(function(r, i){
      h += '<div class="reason rv"><div class="r-img"><img src="' + esc(r.img) + '" alt="" loading="lazy"></div><div class="r-txt"><div class="k">REASON ' + (i + 1) + "</div><h3>" + esc(r.title) + "</h3><p>" + esc(r.text) + "</p></div></div>";
    });
    h += "</div></div></section>";
  }

  // 代表あいさつ
  if (S.message){
    var m = S.message;
    h += '<section class="sec dark" id="message"><div class="wrap"><div class="hgroup rv"><span class="e">MESSAGE</span><h2>代表ごあいさつ</h2></div>'
      + '<div class="msg"><div class="msg-ph rv">' + (m.photo ? '<img src="' + esc(m.photo) + '" alt="' + esc(m.name) + '" loading="lazy">' : "") + "</div>"
      + '<div class="rv"><h3>' + hl(m.heading) + "</h3>" + (m.paras || []).map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("")
      + '<div class="sign"><small>' + esc(m.role) + "</small><b>" + esc(m.name) + "</b></div></div></div></div></section>";
  }

  // 工事の内容
  if (S.services && S.services.length){
    h += '<section class="sec" id="service"><div class="wrap"><div class="hgroup rv"><span class="e">SERVICE</span><h2>工事の内容</h2></div><div class="svcs">'
      + S.services.map(function(s){ return '<div class="svc rv"><img src="' + esc(s.img) + '" alt="" loading="lazy"><div class="svc-in"><div class="e">' + esc(s.en) + "</div><h3>" + esc(s.title) + "</h3><p>" + esc(s.text) + "</p></div></div>"; }).join("")
      + "</div></div></section>";
  }

  // 流れ
  if (S.flow && S.flow.length){
    h += '<section class="sec mist" id="flow"><div class="wrap"><div class="hgroup rv"><span class="e">FLOW</span><h2>ご依頼の流れ</h2></div><ol class="flow" id="flowList">'
      + S.flow.map(function(f){ return "<li><h3>" + esc(f.title) + "</h3><p>" + esc(f.text) + "</p></li>"; }).join("")
      + "</ol></div></section>";
  }

  // 会社概要
  if (S.profile && S.profile.length){
    h += '<section class="sec" id="company"><div class="wrap"><div class="hgroup rv"><span class="e">COMPANY</span><h2>会社概要</h2></div><table class="prof rv">'
      + S.profile.map(function(r){ return "<tr><th>" + esc(r[0]) + "</th><td>" + esc(r[1]) + "</td></tr>"; }).join("")
      + "</table></div></section>";
  }

  // お問い合わせ
  var bgImg = slides.length ? slides[slides.length - 1].img : "";
  h += '<section class="contact" id="contact"><div class="bg" style="background-image:url(\'' + esc(bgImg) + '\')"></div><div class="wrap"><div class="hgroup"><span class="e">CONTACT</span></div><div class="ct-grid">'
    + '<div class="rv"><p class="ct-big">お見積り・ご相談は<br><span class="gold">無料</span>です。</p><p class="ct-note">' + esc(S.area) + "。現地を拝見したうえで、建物に合った方法を正直にご提案します。</p>"
    + '<a class="ct-tel" href="' + telHref(S.tel) + '"><small>お電話でのご相談</small><b>' + esc(S.tel) + '</b></a><p class="ct-note">' + esc(S.telNote) + "</p></div>"
    + '<form class="form rv" id="form" novalidate>'
    + '<label for="f-name">お名前<span>必須</span><input id="f-name" name="name" autocomplete="name" required></label>'
    + '<label for="f-tel">お電話番号<span>必須</span><input id="f-tel" name="tel" type="tel" autocomplete="tel" required></label>'
    + '<label for="f-kind">ご相談の内容<select id="f-kind" name="kind">' + (S.contactKinds || ["お見積り"]).map(function(k){ return "<option>" + esc(k) + "</option>"; }).join("") + "</select></label>"
    + '<label for="f-msg">ご質問・ご要望<textarea id="f-msg" name="msg"></textarea></label>'
    + '<button class="btn btn-gold shine" type="submit">この内容で送信する <span class="arw">→</span></button>'
    + '<p class="done" id="done" hidden>ありがとうございます。担当者よりご連絡いたします。</p>'
    + "</form></div></div></section>";

  h += '<footer class="ft"><div class="wrap"><b>' + esc(S.company) + "</b><p>" + esc((S.profile || []).filter(function(r){ return r[0] === "所在地"; }).map(function(r){ return r[1]; })[0] || "") + '</p><p>TEL ' + esc(S.tel) + "</p><p>&copy; " + esc(S.companyEn || S.company) + "</p></div></footer>";
  h += '<div class="fixbar" id="fixbar"><a href="' + telHref(S.tel) + '">電話で相談</a><a href="#contact">無料見積り</a></div>';

  document.getElementById("app").innerHTML = h;

  /* ---------- オープニング ---------- */
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var hero = document.querySelector(".hero");
  function startHero(){ hero.classList.add("ready"); go(0, true); }
  if (!reduce && !sessionStorageSafe("introSeen")){
    var intro = document.createElement("div");
    intro.className = "intro";
    intro.innerHTML = '<div class="nm"><b>' + Array.from(S.companyEn || S.company || "").map(function(c, i){ return '<span style="animation-delay:' + (i * 0.05) + 's">' + (c === " " ? "&nbsp;" : esc(c)) + "</span>"; }).join("") + "</b><i></i></div>";
    document.body.appendChild(intro);
    setTimeout(function(){ intro.classList.add("open"); startHero(); }, 1500);
    setTimeout(function(){ intro.remove(); }, 2700);
  } else { startHero(); }
  function sessionStorageSafe(k){ try { var v = sessionStorage.getItem(k); sessionStorage.setItem(k, "1"); return v; } catch(e){ return null; } }

  /* ---------- カルーセル ---------- */
  var DUR = 6500;
  var slideEls = [].slice.call(document.querySelectorAll(".slide"));
  var thumbEls = [].slice.call(document.querySelectorAll(".thumb"));
  var en = document.getElementById("en"), copy = document.getElementById("copy");
  var kicker = document.getElementById("kicker"), catchEl = document.getElementById("catch"), sweep = document.getElementById("sweep");
  var cur = -1, timer = null;
  document.documentElement.style.setProperty("--dur", DUR + "ms");

  function setText(s){
    en.innerHTML = (s.en || []).map(function(l){ return '<span class="ln">' + chars(l) + "</span>"; }).join("");
    kicker.textContent = s.kicker || "";
    catchEl.innerHTML = (s.catch || []).map(function(l){ return '<span class="ln"><span>' + hl(l) + "</span></span>"; }).join("");
    void en.offsetWidth;
    en.className = "en on"; copy.className = "copy on";
  }
  function go(n, first){
    if (!slideEls.length) return;
    n = (n + slideEls.length) % slideEls.length;
    if (n === cur) return;
    var prev = cur; cur = n;
    slideEls.forEach(function(el, i){
      el.classList.remove("is-prev");
      if (i === prev) { el.classList.remove("is-on"); el.classList.add("is-prev"); }
      else if (i !== n) el.classList.remove("is-on");
    });
    var next = slideEls[n];
    next.classList.remove("is-on"); void next.offsetWidth; next.classList.add("is-on");
    thumbEls.forEach(function(t, i){ t.classList.remove("is-on"); if (i === n){ void t.offsetWidth; t.classList.add("is-on"); } });
    if (!first){
      sweep.classList.remove("go"); void sweep.offsetWidth; sweep.classList.add("go");
      en.className = "en off"; copy.className = "copy";
      setTimeout(function(){ setText(slides[n]); }, 420);
    } else { setText(slides[n]); }
    clearTimeout(timer); timer = setTimeout(function(){ go(cur + 1); }, DUR);
  }
  thumbEls.forEach(function(t){ t.addEventListener("click", function(){ go(+t.dataset.i); }); });

  // スマホのスワイプ
  var sx = null;
  hero.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; }, {passive:true});
  hero.addEventListener("touchend", function(e){ if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); sx = null; });

  // マウスに合わせて英字がわずかに動く
  if (!reduce && window.matchMedia("(pointer:fine)").matches){
    hero.addEventListener("mousemove", function(e){
      var x = (e.clientX / innerWidth - .5), y = (e.clientY / innerHeight - .5);
      en.style.translate = (x * -30) + "px " + (y * -18) + "px";
    });
  }

  /* ---------- ヘッダー・固定ボタン ---------- */
  var hd = document.getElementById("hd"), fixbar = document.getElementById("fixbar");
  function onScroll(){ var y = scrollY; hd.classList.toggle("solid", y > 60); fixbar.classList.toggle("show", y > innerHeight * .6); }
  addEventListener("scroll", onScroll, {passive:true}); onScroll();
  var menuBtn = document.getElementById("menuBtn"), navEl = document.getElementById("nav");
  menuBtn.addEventListener("click", function(){ var o = navEl.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", o); menuBtn.textContent = o ? "CLOSE" : "MENU"; hd.classList.add("solid"); });
  navEl.addEventListener("click", function(e){ if (e.target.tagName === "A"){ navEl.classList.remove("open"); menuBtn.textContent = "MENU"; menuBtn.setAttribute("aria-expanded", false); } });

  /* ---------- 施工前・施工後の見比べ ---------- */
  [].forEach.call(document.querySelectorAll(".cmp input"), function(inp){
    inp.addEventListener("input", function(){ inp.parentNode.style.setProperty("--p", inp.value + "%"); });
  });

  /* ---------- スクロールで表示・数字のカウントアップ ---------- */
  function countUp(el){
    var to = parseFloat(el.dataset.to) || 0, t0 = null, d = 1600;
    if (reduce){ el.textContent = to; return; }
    function step(t){ if (!t0) t0 = t; var p = Math.min((t - t0) / d, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step); else { el.classList.add("pop"); } }
    el.textContent = "0"; requestAnimationFrame(step);
  }
  var targets = [].slice.call(document.querySelectorAll(".rv, .fact .n, #flowList"));
  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){
      if (!e.isIntersecting) return;
      var el = e.target; io.unobserve(el);
      if (el.classList.contains("n")) countUp(el); else el.classList.add("in");
    }); }, {threshold:.18, rootMargin:"0px 0px -6% 0px"});
    targets.forEach(function(el){ io.observe(el); });
  } else { targets.forEach(function(el){ el.classList.add("in"); }); }

  /* ---------- フォーム(見本のため送信はしません) ---------- */
  document.getElementById("form").addEventListener("submit", function(e){ e.preventDefault(); document.getElementById("done").hidden = false; });
})();
</script>
</body>
</html>
