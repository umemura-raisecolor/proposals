<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>案1 STREAK｜テンプレート試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
/* 案1 STREAK:黒地に、ローラーで塗ったような斜めの色の帯が走る。大胆な一言のコピー */
:root{--bg:#0d0f12;--ink:#fff;--sub:#a9b0b8;--accent:#2f8cff;--line:rgba(255,255,255,.14);--disp:"Oswald",sans-serif;--jp:"Noto Sans JP",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp)}
header{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;gap:30px;padding:24px max(20px,3vw)}
header .logo{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.08em}
header nav{margin-left:auto;display:flex;gap:28px;font-family:var(--disp);font-size:15px;letter-spacing:.14em}
header nav a{color:#fff;text-decoration:none;opacity:.85}
header .cta{font-family:var(--disp);letter-spacing:.14em;padding:12px 22px;border:1px solid #fff;color:#fff;text-decoration:none}
.fv{position:relative;min-height:100svh;overflow:hidden;display:flex;align-items:flex-end}
/* 写真は斜めの平行四辺形で右に。表示時に左から開く */
.ph{position:absolute;top:0;bottom:0;right:0;width:62%;clip-path:polygon(28% 0,100% 0,100% 100%,0 100%);animation:open 1.4s cubic-bezier(.7,0,.2,1) .2s both}
.ph img{width:100%;height:100%;object-fit:cover;object-position:70% 35%;filter:grayscale(.35) contrast(1.1) brightness(.8)}
@keyframes open{from{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}}
/* ローラーの帯:斜めに一気に塗られる */
.streak{position:absolute;left:-10%;top:44%;width:130%;height:64px;background:var(--accent);transform:rotate(-8deg) scaleX(0);transform-origin:left;animation:paint 1.1s cubic-bezier(.7,0,.2,1) .9s forwards;mix-blend-mode:screen;opacity:.92}
.streak::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px)}
@keyframes paint{to{transform:rotate(-8deg) scaleX(1)}}
.copy{position:relative;z-index:3;padding:0 max(20px,5vw) 9vh;max-width:1400px}
.eyebrow{font-family:var(--disp);letter-spacing:.3em;font-size:14px;color:var(--sub);margin:0 0 18px}
h1{margin:0;font-weight:900;font-size:clamp(46px,7.6vw,130px);line-height:1.04;letter-spacing:-.01em}
h1 span{display:block;overflow:hidden}
h1 span i{display:block;font-style:normal;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
h1 span:nth-child(2) i{animation-delay:.15s}
h1 em{font-style:normal;color:var(--accent)}
@keyframes up{to{transform:none}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:26px;margin-top:34px}
.row p{margin:0;color:var(--sub);max-width:34em;line-height:1.9}
.btn{display:inline-flex;align-items:center;gap:14px;min-height:62px;padding:0 30px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.06em}
.btn b{font-family:var(--disp);font-weight:500}
.nums{position:absolute;z-index:3;right:max(20px,3vw);top:50%;transform:translateY(-50%);display:grid;gap:22px;text-align:right}
.nums div{font-family:var(--disp);font-weight:700;font-size:64px;line-height:1}
.nums small{display:block;font-family:var(--jp);font-weight:700;font-size:12px;color:var(--sub);letter-spacing:.1em;margin-top:6px}
.tag{position:absolute;left:max(20px,5vw);top:110px;z-index:3;font-family:var(--disp);font-size:13px;letter-spacing:.3em;color:var(--sub)}
.next{padding:90px max(20px,5vw);border-top:1px solid var(--line)}
.next h2{font-family:var(--disp);font-size:clamp(48px,7vw,100px);margin:0;line-height:1}
.next h2 small{display:block;font-family:var(--jp);font-size:18px;color:var(--sub);margin-top:10px;letter-spacing:.1em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.cards figure{margin:0;position:relative;overflow:hidden}
.cards img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(.3);transition:transform 1s,filter .6s}
.cards figure:hover img{transform:scale(1.06);filter:none}
.cards figcaption{position:absolute;left:0;bottom:0;right:0;padding:16px;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);font-weight:700}
.cards figcaption b{display:block;font-family:var(--disp);color:var(--accent);font-size:12px;letter-spacing:.2em}
@media (max-width:860px){header nav{display:none}.ph{width:100%;opacity:.5;clip-path:none;animation:none}.nums{display:none}.cards{grid-template-columns:1fr}.streak{height:40px}}
@media (prefers-reduced-motion:reduce){.ph,.streak,h1 span i{animation:none}.streak{transform:rotate(-8deg)}h1 span i{transform:none}}
</style></head><body>
<header><span class="logo">TO-SHIN</span><nav><a href="#">ABOUT</a><a href="#">SERVICE</a><a href="#">WORKS</a><a href="#">COMPANY</a></nav><a class="cta" href="#">CONTACT</a></header>
<section class="fv">
  <div class="ph"><img src="https://to-shin.tokyo/wp-content/uploads/2025/03/DSCN0027-scaled.jpg" alt=""></div>
  <div class="streak" aria-hidden="true"></div>
  <p class="tag">PAINTING ・ WATERPROOF ・ RENOVATION</p>
  <div class="nums" aria-hidden="true"><div>16<small>年後も剥がれない</small></div><div>1<small>級塗装技能士が責任</small></div></div>
  <div class="copy">
    <p class="eyebrow">CHOFU, TOKYO</p>
    <h1><span><i>塗装の差は、</i></span><span><i><em>16年後</em>に出る。</i></span></h1>
    <div class="row"><a class="btn" href="#">無料でお見積り <b>→</b></a><p>見えなくなる下地まで、一切手を抜かない。一級塗装技能士が率いる職人の会社です。</p></div>
  </div>
</section>
<section class="next"><h2>WORKS<small>施工実績</small></h2>
<div class="cards">
 <figure><img src="https://to-shin.tokyo/wp-content/uploads/2025/03/IMG_7684-scaled.jpg" alt=""><figcaption><b>CHOFU</b>外壁サイディング塗り替え</figcaption></figure>
 <figure><img src="https://to-shin.tokyo/wp-content/uploads/2022/09/IMG_9191-scaled.jpg" alt=""><figcaption><b>SAKURAJOSUI</b>アパートの塗り替え</figcaption></figure>
 <figure><img src="https://to-shin.tokyo/wp-content/uploads/2025/03/IMG_8059-scaled.jpg" alt=""><figcaption><b>INAGI</b>屋根カバー工法・外壁塗装</figcaption></figure>
</div></section>
</body></html>
